<!DOCTYPE html>
<html>
<head>
  <title>Lab 7 - A-Frame Geolocation (Updated Shapes)</title>

  <!-- A-Frame CDN -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>
<h3 id="location">Fetching location...</h3>

<a-scene>
  <!-- NEW 3D Shapes -->

  <!-- Cone -->
  <a-cone id="cone"
          position="0 0.75 -3"
          radius-bottom="0.7"
          height="1.5"
          color="orange"
          visible="false">
  </a-cone>

  <!-- Torus -->
  <a-torus id="torus"
           position="2 1 -3"
           radius="0.6"
           radius-tubular="0.15"
           color="green"
           visible="false">
  </a-torus>

  <!-- Octahedron -->
  <a-octahedron id="octahedron"
                position="-2 1 -3"
                radius="0.9"
                color="red"
                visible="false">
  </a-octahedron>

  <a-camera></a-camera>
</a-scene>

<script>
const locations = [
  { id: "cone", lat: 12.9564672, lon: 77.6208384 },
  { id: "torus", lat: 12.90509057, lon: 77.55971556 },
  { id: "octahedron", lat: 12.9564672, lon: 77.594624 }
];

// Increased threshold for lab demo
const THRESHOLD = 0.05;

navigator.geolocation.getCurrentPosition(
  (position) => {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    document.getElementById("location").innerText =
      `Latitude: ${lat} | Longitude: ${lon}`;

    locations.forEach(loc => {
      if (Math.abs(lat - loc.lat) < THRESHOLD &&
          Math.abs(lon - loc.lon) < THRESHOLD) {
        document.getElementById(loc.id)
          .setAttribute("visible", true);
      }
    });
  },
  (error) => {
    document.getElementById("location").innerText =
      "Location error: " + error.message;
  },
  { enableHighAccuracy: true }
);
</script>

</body>
</html>
